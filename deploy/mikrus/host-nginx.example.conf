# Optional example for a VPS that can receive HTTPS on port 443.
# Obtain the certificate separately and replace the example hostname/paths.
# Shared Mikrus HTTPS proxies can be used instead; see README.md.
server {
    listen 80;
    server_name aftertab.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aftertab.example.com;
    ssl_certificate /etc/letsencrypt/live/aftertab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aftertab.example.com/privkey.pem;

    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
